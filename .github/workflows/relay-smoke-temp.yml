name: Temporary relay smoke

on:
  push:
    branches:
      - feat/charipay-integration
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check relay health
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS --max-time 15 -o /tmp/relay-health.txt -w '%{http_code}'             'https://fond-antique-camel--AliBied.replit.app/health')"
          echo "health_status=${status}"
          cat /tmp/relay-health.txt
          test "${status}" = "200"

      - name: Send invalid-signature webhook through relay
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS --max-time 25 -o /tmp/relay-response.txt -w '%{http_code}'             -X POST             -H 'content-type: application/json'             -H 'x-chari-signature: invalid'             -H 'x-chari-timestamp: 0'             --data-binary '{"type":"payment.succeeded","data":{"id":"relay-smoke"}}'             'https://fond-antique-camel--AliBied.replit.app/webhook/charipay' || true)"
          echo "relay_post_status=${status}"
          cat /tmp/relay-response.txt || true
